[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uast"
version = "0.1.0"
description = "Real-time security monitoring for AI coding agents. Detects supply chain attacks, compromised dependencies, and suspicious agent behavior."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michel Hjazeen", email = "michel@michelhjazeen.com" }]
keywords = ["security", "ai", "coding-agents", "supply-chain", "sast", "dast", "cursor", "claude-code", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "packaging>=23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/mjjjjaazing/uast"
Repository = "https://github.com/mjjjjaazing/uast"
Issues = "https://github.com/mjjjjaazing/uast/issues"
Paper = "https://arxiv.org/abs/uast-paper"

[project.scripts]
uast = "uast.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["uast*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=uast --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert usage is fine in production code for this project
